<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CMB Anisotropy Explorer</title>
<style>
  :root {
    --bg: #101016;
    --panel: #1c1c26;
    --text: #e1e1e6;
    --dim: #8c8c9b;
    --accent: #ffaa3c;
    --track: #3c3c4b;
    --fill: #5a78be;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: Consolas, "Cascadia Mono", Menlo, monospace;
  }
  #app { max-width: 1000px; margin: 0 auto; }
  #map {
    display: block;
    width: 100%;
    image-rendering: auto;
  }
  #panel {
    background: var(--panel);
    border-top: 2px solid #464659;
    padding: 18px 40px 10px;
    display: flex;
    flex-wrap: wrap;
    gap: 24px 60px;
  }
  .sliders { flex: 1 1 380px; min-width: 320px; }
  .slider-row { margin-bottom: 22px; }
  .slider-head {
    display: flex;
    justify-content: space-between;
    font-size: 14px;
    margin-bottom: 6px;
  }
  .slider-head .value { color: var(--accent); }
  input[type="range"] {
    -webkit-appearance: none;
    appearance: none;
    width: 100%;
    height: 6px;
    border-radius: 3px;
    background: var(--track);
    outline: none;
    margin: 8px 0;
  }
  input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none;
    appearance: none;
    width: 18px; height: 18px;
    border-radius: 50%;
    background: var(--text);
    border: 2px solid var(--fill);
    cursor: pointer;
  }
  input[type="range"]::-moz-range-thumb {
    width: 14px; height: 14px;
    border-radius: 50%;
    background: var(--text);
    border: 2px solid var(--fill);
    cursor: pointer;
  }
  .telemetry { flex: 1 1 380px; min-width: 340px; font-size: 14px; }
  .telemetry h2 {
    color: var(--accent);
    font-size: 17px;
    margin: 0 0 12px;
    letter-spacing: 1px;
  }
  .telemetry table { border-collapse: collapse; width: 100%; }
  .telemetry td { padding: 3px 0; }
  .telemetry td:first-child { color: var(--dim); }
  .telemetry td:last-child { text-align: right; font-variant-numeric: tabular-nums; }
  #footer {
    background: var(--panel);
    padding: 6px 40px 14px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 12px;
    color: var(--dim);
    flex-wrap: wrap;
    gap: 8px;
  }
  #status { color: var(--accent); }
  button {
    background: var(--track);
    color: var(--text);
    border: 1px solid var(--fill);
    border-radius: 4px;
    padding: 4px 12px;
    font-family: inherit;
    font-size: 12px;
    cursor: pointer;
  }
  button:hover { background: var(--fill); }
</style>
</head>
<body>
<div id="app">
  <canvas id="map" width="1000" height="520"></canvas>
  <div id="panel">
    <div class="sliders">
      <div class="slider-row">
        <div class="slider-head">
          <span>Universe Age / Cooling</span>
          <span class="value" id="tempValue"></span>
        </div>
        <input type="range" id="tempSlider" min="0" max="1000" value="0">
      </div>
      <div class="slider-row">
        <div class="slider-head">
          <span>Density Perturbation Amplitude (&Delta;T/T)</span>
          <span class="value" id="ampValue"></span>
        </div>
        <input type="range" id="ampSlider" min="0" max="1000" value="0">
      </div>
      <button id="pauseBtn">Pause</button>
      <button id="seedBtn">New Seed</button>
    </div>
    <div class="telemetry">
      <h2>TELEMETRY</h2>
      <table>
        <tr><td>Average Temperature</td>      <td id="tAvg"></td></tr>
        <tr><td>Peak Frequency&nbsp;&nbsp;(Planck)</td> <td id="nuPeak"></td></tr>
        <tr><td>Peak Wavelength (Wien)</td>   <td id="lamPeak"></td></tr>
        <tr><td>&Delta;T (rms anisotropy)</td><td id="dtRms"></td></tr>
        <tr><td>Redshift z / Age</td>         <td id="zAge"></td></tr>
      </table>
    </div>
  </div>
  <div id="footer">
    <span>LEFT/RIGHT cool-reheat &nbsp;|&nbsp; UP/DOWN amplitude &nbsp;|&nbsp;
          SPACE pause &nbsp;|&nbsp; R new seed</span>
    <span id="status"></span>
  </div>
</div>

<script>
"use strict";

// ---------------------------------------------------------------- physics
const WIEN_B = 2.897771955e-3;         // m*K
const NU_PEAK_PER_K = 5.878925757e10;  // Hz per Kelvin
const T_TODAY = 2.72548;               // K (Fixsen 2009)
const T_RECOMBINATION = 3000.0;        // K

// Age of the universe vs scale factor from integrating the Friedmann
// equation (flat LCDM, Planck 2018: H0=67.36, Om=0.3153, radiation
// included), tabulated once at startup. Replaces the matter-era
// (1+z)^-3/2 approximation, whose error peaked at ~20% around z~6.
const AGE_TABLE = (() => {
  const H0 = 67.36e3 / 3.0856775814913673e22;      // s^-1
  const omegaR = 2.4728e-5 / 0.6736 ** 2 * (1 + 0.2271 * 3.046);
  const omegaM = 0.3153, omegaL = 1 - omegaM - omegaR;
  const N = 20000, lnMin = Math.log(1e-10);
  const a = new Float64Array(N), t = new Float64Array(N);
  let prevA = 0, prevF = 0, acc = 0;
  for (let i = 0; i < N; i++) {
    const ai = Math.exp(lnMin * (1 - i / (N - 1)));
    const Ha = H0 * Math.sqrt(omegaR / ai ** 4 + omegaM / ai ** 3 + omegaL);
    const f = 1 / (ai * Ha);
    if (i > 0) acc += 0.5 * (f + prevF) * (ai - prevA);
    a[i] = ai; t[i] = acc / 3.1557e7;               // years
    prevA = ai; prevF = f;
  }
  return { a, t };
})();

function ageAtZ(z) {
  const av = 1 / (1 + Math.max(z, 0));
  const { a, t } = AGE_TABLE;
  let lo = 0, hi = a.length - 1;
  while (hi - lo > 1) {
    const m = (lo + hi) >> 1;
    if (a[m] <= av) lo = m; else hi = m;
  }
  const f = (av - a[lo]) / (a[hi] - a[lo]);
  return t[lo] + f * (t[hi] - t[lo]);
}

// ---------------------------------------------------------------- engine
const FIELD_W = 384, FIELD_H = 240, N_PIX = FIELD_W * FIELD_H;
const N_WAVES = 48;

function mulberry32(a) {
  return function () {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}

// Sum of random sine plane waves with standing-wave time modulation.
// The spatial basis sin(k.x + phi) is precomputed once per seed, so each
// frame is a single coefficient contraction over typed arrays.
class CMBField {
  constructor(seed) {
    const rng = mulberry32(seed);
    this.amp = new Float32Array(N_WAVES);
    this.omega = new Float32Array(N_WAVES);
    this.psi = new Float32Array(N_WAVES);
    this.basis = new Float32Array(N_WAVES * N_PIX);

    const lnMin = Math.log(18.0), lnMax = Math.log(260.0);
    const PEAK_SCALE = 70.0;
    let sumSq = 0;
    for (let k = 0; k < N_WAVES; k++) {
      // wavelengths log-uniform, amplitudes peaked at a preferred scale --
      // a cartoon of the first acoustic peak
      const lam = Math.exp(lnMin + rng() * (lnMax - lnMin));
      const u = Math.log(lam / PEAK_SCALE) / 0.75;
      const a = Math.exp(-u * u) * (0.6 + rng() * 0.8);
      const kmag = 2 * Math.PI / lam;
      const theta = rng() * 2 * Math.PI;
      const kx = kmag * Math.cos(theta), ky = kmag * Math.sin(theta);
      const phi = rng() * 2 * Math.PI;

      this.amp[k] = a;
      this.psi[k] = rng() * 2 * Math.PI;
      // smaller modes oscillate faster (omega ~ k); dominant scale ~12 s
      this.omega[k] = (2 * Math.PI / 12.0) * (PEAK_SCALE / lam);
      sumSq += a * a;

      const base = k * N_PIX;
      for (let y = 0; y < FIELD_H; y++) {
        const kyy = ky * y + phi;
        for (let x = 0; x < FIELD_W; x++) {
          this.basis[base + y * FIELD_W + x] = Math.sin(kx * x + kyy);
        }
      }
    }
    // fixed normalization from expected RMS (spatial & temporal sin^2 -> 1/2
    // each), so the standing-wave pulsing stays visible
    this.norm = 1.0 / (2.8 * Math.sqrt(sumSq / 4.0));
  }

  evaluate(t, out) {
    out.fill(0);
    for (let k = 0; k < N_WAVES; k++) {
      const c = this.amp[k] * Math.cos(this.omega[k] * t + this.psi[k]);
      const base = k * N_PIX, basis = this.basis;
      for (let i = 0; i < N_PIX; i++) out[i] += c * basis[base + i];
    }
    const n = this.norm;
    for (let i = 0; i < N_PIX; i++) out[i] *= n;
  }
}

// ---------------------------------------------------------------- colormap
function buildColormap() {
  const stops = [
    [0.00, [10, 15, 95]],
    [0.20, [25, 80, 200]],
    [0.42, [120, 175, 230]],
    [0.50, [232, 228, 218]],
    [0.58, [250, 195, 105]],
    [0.80, [225, 85, 30]],
    [1.00, [140, 5, 20]],
  ];
  const lut = new Uint8Array(256 * 3);
  for (let i = 0; i < 256; i++) {
    const x = i / 255;
    let s = 0;
    while (s < stops.length - 2 && x > stops[s + 1][0]) s++;
    const [x0, c0] = stops[s], [x1, c1] = stops[s + 1];
    const f = Math.min(1, Math.max(0, (x - x0) / (x1 - x0)));
    for (let c = 0; c < 3; c++) {
      lut[i * 3 + c] = Math.round(c0[c] + f * (c1[c] - c0[c]));
    }
  }
  return lut;
}

// ---------------------------------------------------------------- formatting
const fmtTemp = t => t >= 10 ? t.toLocaleString("en-US",
  { maximumFractionDigits: 1, minimumFractionDigits: 1 }) + " K"
  : t.toFixed(4) + " K";
const fmtFreq = hz => hz >= 1e12 ? (hz / 1e12).toFixed(2) + " THz"
  : (hz / 1e9).toFixed(1) + " GHz";
const fmtWavelength = m => m < 1e-6 ? (m * 1e9).toFixed(0) + " nm"
  : m < 1e-3 ? (m * 1e6).toFixed(2) + " µm"
  : (m * 1e3).toFixed(3) + " mm";
const fmtDeltaT = k => k >= 1 ? k.toFixed(2) + " K"
  : k >= 1e-3 ? (k * 1e3).toFixed(2) + " mK"
  : (k * 1e6).toFixed(1) + " µK";
const fmtAge = yr => yr < 1e6 ? (yr / 1e3).toFixed(0) + " kyr"
  : yr < 1e9 ? (yr / 1e6).toFixed(1) + " Myr"
  : (yr / 1e9).toFixed(2) + " Gyr";

// ---------------------------------------------------------------- app state
const canvas = document.getElementById("map");
const ctx = canvas.getContext("2d");
const off = document.createElement("canvas");
off.width = FIELD_W; off.height = FIELD_H;
const offCtx = off.getContext("2d");
const image = offCtx.createImageData(FIELD_W, FIELD_H);
const pixels = image.data;

const lut = buildColormap();
const fieldBuf = new Float32Array(N_PIX);
let field = new CMBField((Math.random() * 2 ** 31) | 0);

const tempSlider = document.getElementById("tempSlider");
const ampSlider = document.getElementById("ampSlider");
const AMP_MIN = 1e-4, AMP_MAX = 0.3, AMP_DEFAULT = 0.02;

// log-scale mapping: slider position t in [0,1] -> value
const tempFromT = t => T_RECOMBINATION * (T_TODAY / T_RECOMBINATION) ** t;
const ampFromT = t => AMP_MIN * (AMP_MAX / AMP_MIN) ** t;
ampSlider.value = Math.round(
  1000 * Math.log(AMP_DEFAULT / AMP_MIN) / Math.log(AMP_MAX / AMP_MIN));

let simTime = 0, paused = false, lastTs = null;
let fps = 60;
const keys = {};

document.getElementById("pauseBtn").addEventListener("click", togglePause);
document.getElementById("seedBtn").addEventListener("click", reseed);

function togglePause() {
  paused = !paused;
  document.getElementById("pauseBtn").textContent = paused ? "Resume" : "Pause";
}
function reseed() { field = new CMBField((Math.random() * 2 ** 31) | 0); }

window.addEventListener("keydown", e => {
  if (e.code === "Space") { togglePause(); e.preventDefault(); }
  else if (e.key === "r" || e.key === "R") reseed();
  else if (e.key.startsWith("Arrow")) { keys[e.key] = true; e.preventDefault(); }
});
window.addEventListener("keyup", e => { keys[e.key] = false; });
window.addEventListener("blur", () => { for (const k in keys) keys[k] = false; });

function nudge(slider, dt) {
  slider.value = Math.min(1000, Math.max(0, +slider.value + 600 * dt));
}

// ---------------------------------------------------------------- main loop
function frame(ts) {
  const dt = lastTs === null ? 0.016 : Math.min((ts - lastTs) / 1000, 0.1);
  lastTs = ts;
  fps = fps * 0.95 + (1 / Math.max(dt, 1e-4)) * 0.05;

  // keyboard nudges (slider runs hot -> cold, so LEFT cools)
  if (keys.ArrowLeft) nudge(tempSlider, dt);
  if (keys.ArrowRight) nudge(tempSlider, -dt);
  if (keys.ArrowUp) nudge(ampSlider, dt);
  if (keys.ArrowDown) nudge(ampSlider, -dt);

  if (!paused) simTime += dt;

  const tBase = tempFromT(tempSlider.value / 1000);
  const amp = ampFromT(ampSlider.value / 1000);

  // ---- simulate
  field.evaluate(simTime, fieldBuf);

  // ---- physics telemetry from the actual temperature map T = T0(1 + a*f)
  let sum = 0, sumSq = 0;
  for (let i = 0; i < N_PIX; i++) {
    const T = tBase * (1 + amp * fieldBuf[i]);
    sum += T; sumSq += T * T;
  }
  const tAvg = sum / N_PIX;
  const dtRms = Math.sqrt(Math.max(sumSq / N_PIX - tAvg * tAvg, 0));
  const nuPeak = NU_PEAK_PER_K * tAvg;
  const lamPeak = WIEN_B / tAvg;
  const redshift = tBase / T_TODAY - 1;
  const ageYr = ageAtZ(redshift);

  // ---- render: contrast tracks the amplitude slider (unity at dT/T = 0.02)
  const gain = Math.sqrt(amp / 0.02);
  for (let i = 0; i < N_PIX; i++) {
    let v = fieldBuf[i] * gain;
    if (v > 1) v = 1; else if (v < -1) v = -1;
    const idx = ((v + 1) * 127.5) | 0;
    const p = i * 4, l = idx * 3;
    pixels[p] = lut[l]; pixels[p + 1] = lut[l + 1];
    pixels[p + 2] = lut[l + 2]; pixels[p + 3] = 255;
  }
  offCtx.putImageData(image, 0, 0);
  ctx.imageSmoothingEnabled = true;
  ctx.imageSmoothingQuality = "high";
  ctx.drawImage(off, 0, 0, canvas.width, canvas.height);

  // ---- UI text
  document.getElementById("tempValue").textContent = fmtTemp(tBase);
  document.getElementById("ampValue").textContent = amp.toExponential(2);
  document.getElementById("tAvg").textContent = fmtTemp(tAvg);
  document.getElementById("nuPeak").textContent = fmtFreq(nuPeak);
  document.getElementById("lamPeak").textContent = fmtWavelength(lamPeak);
  document.getElementById("dtRms").textContent = fmtDeltaT(dtRms);
  document.getElementById("zAge").textContent =
    Math.round(redshift).toLocaleString("en-US") + " / " + fmtAge(ageYr);
  document.getElementById("status").textContent =
    paused ? "PAUSED" : Math.round(fps) + " fps";
}

// Frame driver: prefer requestAnimationFrame, but some embedded/streamed
// viewers report the page as hidden and never fire rAF while timers still
// run at full rate -- so a timer watchdog steps frames whenever rAF stalls.
let lastRaf = 0, lastDriven = 0;
function drive(ts) { lastDriven = performance.now(); frame(ts); }
function rafLoop(ts) {
  lastRaf = performance.now();
  drive(ts);
  requestAnimationFrame(rafLoop);
}
requestAnimationFrame(rafLoop);
// Fallback capped at ~20 fps: software-rendered viewers need main-thread
// headroom to composite/stream frames, or the display freezes on a stale
// frame even though the canvas is updating.
setInterval(() => {
  const now = performance.now();
  if (now - lastRaf > 200 && now - lastDriven > 45) drive(now);
}, 25);
</script>
</body>
</html>
