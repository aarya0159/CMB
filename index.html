<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CMB Blackbody Simulator</title>
<style>
  :root {
    --bg: #14141a;
    --panel: #14141a;
    --ink: #e8e6df;
    --muted: #8a8894;
    --accent: #f5a623;
    --btn: #23232e;
    --btn-border: #3a3a48;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: "Consolas", "Menlo", "DejaVu Sans Mono", monospace;
    font-size: 14px;
    display: flex; flex-direction: column; min-height: 100vh;
  }
  #sky { display: block; width: 100%; height: 62vh; min-height: 320px; image-rendering: auto; }
  #panel {
    display: flex; flex-wrap: wrap; gap: 28px;
    padding: 18px 26px 8px 26px;
  }
  #controls { flex: 1 1 420px; max-width: 560px; }
  .ctl-row { margin-bottom: 16px; }
  .ctl-label {
    display: flex; justify-content: space-between; align-items: baseline;
    margin-bottom: 6px;
  }
  .ctl-label .name { color: var(--ink); }
  .ctl-label .val  { color: var(--accent); font-weight: bold; }
  input[type=range] {
    -webkit-appearance: none; appearance: none;
    width: 100%; height: 4px; border-radius: 2px;
    background: #3a3a48; outline: none;
  }
  input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none; appearance: none;
    width: 18px; height: 18px; border-radius: 50%;
    background: #f2f0ea; border: 1px solid #555; cursor: pointer;
  }
  input[type=range]::-moz-range-thumb {
    width: 18px; height: 18px; border-radius: 50%;
    background: #f2f0ea; border: 1px solid #555; cursor: pointer;
  }
  .buttons { margin-top: 6px; }
  button {
    font-family: inherit; font-size: 13px;
    color: var(--ink); background: var(--btn);
    border: 1px solid var(--btn-border); border-radius: 4px;
    padding: 7px 14px; margin-right: 10px; cursor: pointer;
  }
  button:hover { background: #2e2e3a; }
  #telemetry { flex: 1 1 320px; min-width: 300px; }
  #telemetry h2 {
    color: var(--accent); font-size: 14px; letter-spacing: 2px;
    margin-bottom: 12px; font-weight: bold;
  }
  .t-row {
    display: flex; justify-content: space-between;
    padding: 3.5px 0;
  }
  .t-row .k { color: var(--muted); }
  .t-row .v { color: #f2f0ea; font-weight: bold; }
  #hintbar {
    margin-top: auto;
    display: flex; justify-content: space-between;
    padding: 10px 26px 14px 26px;
    color: var(--muted); font-size: 12.5px;
  }
  #fps { color: var(--accent); font-weight: bold; }
</style>
</head>
<body>
<canvas id="sky"></canvas>

<div id="panel">
  <div id="controls">
    <div class="ctl-row">
      <div class="ctl-label">
        <span class="name">Universe Age / Cooling</span>
        <span class="val" id="tempVal">3,000.0 K</span>
      </div>
      <input type="range" id="tempSlider" min="0" max="1000" step="1" value="0">
    </div>
    <div class="ctl-row">
      <div class="ctl-label">
        <span class="name">Density Perturbation Amplitude (&Delta;T/T)</span>
        <span class="val" id="ampVal">5.07e-2</span>
      </div>
      <input type="range" id="ampSlider" min="0" max="1000" step="1" value="940">
    </div>
    <div class="buttons">
      <button id="pauseBtn">Pause</button>
      <button id="seedBtn">New Seed</button>
    </div>
  </div>

  <div id="telemetry">
    <h2>TELEMETRY</h2>
    <div class="t-row"><span class="k">Average Temperature</span><span class="v" id="tAvg">&mdash;</span></div>
    <div class="t-row"><span class="k">Peak Frequency&nbsp;&nbsp;(Planck)</span><span class="v" id="tPeakF">&mdash;</span></div>
    <div class="t-row"><span class="k">Peak Wavelength (Wien)</span><span class="v" id="tPeakL">&mdash;</span></div>
    <div class="t-row"><span class="k">&Delta;T (rms anisotropy)</span><span class="v" id="tRms">&mdash;</span></div>
    <div class="t-row"><span class="k">Redshift z / Age</span><span class="v" id="tZ">&mdash;</span></div>
  </div>
</div>

<div id="hintbar">
  <span>LEFT/RIGHT cool-reheat&nbsp;&nbsp;|&nbsp;&nbsp;UP/DOWN amplitude&nbsp;&nbsp;|&nbsp;&nbsp;SPACE pause&nbsp;&nbsp;|&nbsp;&nbsp;R new seed</span>
  <span id="fps">0 fps</span>
</div>

<script>
"use strict";
/* ============================================================
   CMB Blackbody Simulator
   ------------------------------------------------------------
   Physics used (see the accompanying paper):
     Planck's law            B_nu(T) = (2 h nu^3 / c^2) / (e^{h nu / kB T} - 1)
     Wien, frequency form    nu_peak = 58.7893 GHz/K * T   (x* = 2.8214)
     Wien, wavelength form   lambda_peak = 2.897772 mm*K / T
     Expansion cooling       T = T0 * (1 + z),  T0 = 2.72548 K
     Age (matter era approx) t = 13.8 Gyr / (1+z)^{3/2}
   The map is a smooth Gaussian random field:
     T(x) = Tbar * (1 + A * delta(x)),  delta built from random
     Fourier modes, normalized so the realized rms of delta is
     about 0.37 (fixed by the mode statistics we chose).
   ============================================================ */

const T0        = 2.72548;        // K, CMB temperature today (Fixsen 2009)
const WIEN_F    = 58.7893e9;      // Hz per K  (x* kB / h, x* = 2.8214)
const WIEN_L    = 2.897772e-3;    // m * K
const T_MAX     = 3000.0;         // K, recombination epoch
const AGE_TODAY = 13.8e9;         // years
const FIELD_STD = 0.37;           // realized rms of the unit field

// ---------- Gaussian random field from random Fourier modes ----------
const NMODES = 60;
let modes = [];
function reseed() {
  modes = [];
  for (let i = 0; i < NMODES; i++) {
    const kmag  = 40 + 80 * Math.random();        // blob scale range
    const ang   = Math.random() * Math.PI * 2;
    modes.push({
      kx: kmag * Math.cos(ang),
      ky: kmag * Math.sin(ang),
      om: (Math.random() - 0.5) * 0.5,            // slow evolution
      ph: Math.random() * Math.PI * 2,
      amp: 1
    });
  }
  // normalize: variance of sum of cosines = sum(amp^2)/2  -> set std = FIELD_STD
  const raw = Math.sqrt(NMODES / 2);
  for (const m of modes) m.amp = FIELD_STD / raw;
}
reseed();

// Fast field evaluation: cos(kx*x + ky*y + om*t + ph) expanded with the
// angle-addition identity so the per-pixel inner loop has no trig calls.
function computeField(buf, GW, GH, t) {
  const cA = new Float32Array(NMODES * GW), sA = new Float32Array(NMODES * GW);
  const cB = new Float32Array(NMODES * GH), sB = new Float32Array(NMODES * GH);
  for (let m = 0; m < NMODES; m++) {
    const md = modes[m];
    for (let i = 0; i < GW; i++) {
      const a = md.kx * (i / GW);
      cA[m*GW+i] = md.amp * Math.cos(a);
      sA[m*GW+i] = md.amp * Math.sin(a);
    }
    for (let j = 0; j < GH; j++) {
      const b = md.ky * ((j / GH) * (GH / GW)) + md.om * t + md.ph;
      cB[m*GH+j] = Math.cos(b);
      sB[m*GH+j] = Math.sin(b);
    }
  }
  buf.fill(0);
  for (let m = 0; m < NMODES; m++) {
    for (let j = 0; j < GH; j++) {
      const cb = cB[m*GH+j], sb = sB[m*GH+j];
      const row = j * GW, col = m * GW;
      for (let i = 0; i < GW; i++) {
        buf[row + i] += cA[col+i] * cb - sA[col+i] * sb;
      }
    }
  }
}

// ---------- diverging colormap (RdYlBu reversed: blue=cold, red=hot) ----------
const STOPS = [
  [0.00, 0x31, 0x36, 0x95], [0.10, 0x45, 0x75, 0xb4], [0.22, 0x74, 0xad, 0xd1],
  [0.35, 0xab, 0xd9, 0xe9], [0.45, 0xe0, 0xf3, 0xf8], [0.50, 0xff, 0xff, 0xbf],
  [0.55, 0xfe, 0xe0, 0x90], [0.65, 0xfd, 0xae, 0x61], [0.78, 0xf4, 0x6d, 0x43],
  [0.90, 0xd7, 0x30, 0x27], [1.00, 0xa5, 0x00, 0x26]
];
function colormap(t) {               // t in [0,1]
  t = Math.max(0, Math.min(1, t));
  for (let i = 1; i < STOPS.length; i++) {
    if (t <= STOPS[i][0]) {
      const a = STOPS[i-1], b = STOPS[i];
      const f = (t - a[0]) / (b[0] - a[0]);
      return [a[1]+f*(b[1]-a[1]), a[2]+f*(b[2]-a[2]), a[3]+f*(b[3]-a[3])];
    }
  }
  return [STOPS.at(-1)[1], STOPS.at(-1)[2], STOPS.at(-1)[3]];
}

// ---------- state ----------
let paused = false;
let simT = 0;                        // field evolution time
const tempSlider = document.getElementById("tempSlider");
const ampSlider  = document.getElementById("ampSlider");

function temperature() {             // log scale: slider 0 -> 3000 K, 1000 -> T0
  const p = tempSlider.value / 1000;
  return T_MAX * Math.pow(T0 / T_MAX, p);
}
function amplitude() {               // log scale: 1e-6 .. 1e-1
  const p = ampSlider.value / 1000;
  return Math.pow(10, -6 + 5 * p);
}

// ---------- rendering ----------
const canvas = document.getElementById("sky");
const ctx = canvas.getContext("2d");
const GW = 176, GH = 110;            // coarse physics grid
const off = document.createElement("canvas");
off.width = GW; off.height = GH;
const offCtx = off.getContext("2d");
const img = offCtx.createImageData(GW, GH);
const fieldBuf = new Float32Array(GW * GH);
const COLOR_FULLSCALE = 0.05;        // amplitude giving full color contrast

function render() {
  const A = amplitude();
  computeField(fieldBuf, GW, GH, simT);
  let sum = 0, sum2 = 0;
  const n = GW * GH;
  for (let k = 0; k < n; k++) { const d = fieldBuf[k]; sum += d; sum2 += d * d; }
  const mean = sum / n;
  const std  = Math.sqrt(Math.max(0, sum2 / n - mean * mean));

  // color scale: full contrast at A = 0.05 and +-2.5 field std
  const scale = (A / COLOR_FULLSCALE) / (2.1 * FIELD_STD);
  const px = img.data;
  for (let k = 0; k < n; k++) {
    const t = 0.5 + 0.5 * Math.max(-1, Math.min(1, fieldBuf[k] * scale));
    const c = colormap(t);
    px[4*k] = c[0]; px[4*k+1] = c[1]; px[4*k+2] = c[2]; px[4*k+3] = 255;
  }
  offCtx.putImageData(img, 0, 0);
  ctx.imageSmoothingEnabled = true;
  ctx.imageSmoothingQuality = "high";
  ctx.drawImage(off, 0, 0, canvas.width, canvas.height);
  return { mean, std };
}

// ---------- telemetry ----------
const fmt = new Intl.NumberFormat("en-US", { minimumFractionDigits: 1, maximumFractionDigits: 1 });
function fmtTemp(T) {
  if (T >= 1000) return fmt.format(T) + " K";
  if (T >= 10)   return T.toFixed(1) + " K";
  return T.toFixed(4) + " K";
}
function fmtFreq(f) {
  if (f >= 1e12) return (f / 1e12).toFixed(2) + " THz";
  return (f / 1e9).toFixed(2) + " GHz";
}
function fmtWavelength(l) {
  if (l < 2e-6)  return Math.round(l * 1e9) + " nm";
  if (l < 1e-3)  return (l * 1e6).toFixed(2) + " µm";
  return (l * 1e3).toFixed(3) + " mm";
}
function fmtDT(dt) {
  if (dt >= 1)      return dt.toFixed(2) + " K";
  if (dt >= 1e-3)   return (dt * 1e3).toFixed(2) + " mK";
  return (dt * 1e6).toFixed(2) + " µK";
}
function fmtAge(z) {
  const age = AGE_TODAY / Math.pow(1 + z, 1.5);   // matter-era approximation
  if (age >= 1e9) return (age / 1e9).toFixed(1) + " Gyr";
  if (age >= 1e6) return Math.round(age / 1e6) + " Myr";
  return Math.round(age / 1e3) + " kyr";
}
function fmtExp(a) {
  const e = Math.floor(Math.log10(a));
  return (a / Math.pow(10, e)).toFixed(2) + "e" + e;
}

function updateTelemetry(stats) {
  const Tbar = temperature();
  const A = amplitude();
  const Tavg = Tbar * (1 + A * stats.mean);
  const dTrms = Tbar * A * stats.std;
  const z = Tavg / T0 - 1;
  document.getElementById("tempVal").textContent = fmtTemp(Tbar);
  document.getElementById("ampVal").textContent  = fmtExp(A);
  document.getElementById("tAvg").textContent    = fmtTemp(Tavg);
  document.getElementById("tPeakF").textContent  = fmtFreq(WIEN_F * Tavg);
  document.getElementById("tPeakL").textContent  = fmtWavelength(WIEN_L / Tavg);
  document.getElementById("tRms").textContent    = fmtDT(dTrms);
  document.getElementById("tZ").textContent =
    Math.round(z).toLocaleString("en-US") + " / " + fmtAge(z);
}

// ---------- main loop ----------
let frames = 0, fpsT = performance.now();
function resize() {
  canvas.width  = canvas.clientWidth;
  canvas.height = canvas.clientHeight;
}
window.addEventListener("resize", resize);

function loop(now) {
  if (!paused) simT += 0.016;
  const stats = render();
  updateTelemetry(stats);
  frames++;
  if (now - fpsT >= 500) {
    document.getElementById("fps").textContent =
      Math.round(frames * 1000 / (now - fpsT)) + " fps";
    frames = 0; fpsT = now;
  }
  requestAnimationFrame(loop);
}

// ---------- controls ----------
function togglePause() {
  paused = !paused;
  document.getElementById("pauseBtn").textContent = paused ? "Resume" : "Pause";
}
document.getElementById("pauseBtn").addEventListener("click", togglePause);
document.getElementById("seedBtn").addEventListener("click", reseed);
window.addEventListener("keydown", (e) => {
  const step = 5;
  if (e.code === "Space")      { e.preventDefault(); togglePause(); }
  else if (e.key === "r" || e.key === "R") reseed();
  else if (e.key === "ArrowRight") tempSlider.value = +tempSlider.value + step; // cool
  else if (e.key === "ArrowLeft")  tempSlider.value = +tempSlider.value - step; // reheat
  else if (e.key === "ArrowUp")    ampSlider.value  = +ampSlider.value  + step;
  else if (e.key === "ArrowDown")  ampSlider.value  = +ampSlider.value  - step;
});

resize();
requestAnimationFrame(loop);
</script>
</body>
</html>
